<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedir presupuesto — FestejARG</title>
    <meta name="description" content="Pedí tu presupuesto sin compromiso. Contanos qué evento organizás y te contactamos.">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <a href="index.html" class="logo">🎉 FestejARG</a>
        <nav class="nav" id="nav">
            <a href="index.html">Inicio</a>
            <a href="servicios.html">Servicios</a>
            <a href="como-funciona.html">Cómo funciona</a>
            <a href="contacto.html" class="activo">Contacto</a>
        </nav>
        <button class="nav-toggle" id="navToggle" aria-label="Abrir menú">☰</button>
    </header>

    <!-- ===== ENCABEZADO DE PÁGINA ===== -->
    <section class="page-header">
        <h1>Pedí tu presupuesto</h1>
        <p>Contanos qué estás organizando y te contactamos a la brevedad. Sin compromiso.</p>
    </section>

    <!-- ===== FORMULARIO ===== -->
    <main class="form-wrap">
        <form class="form" id="formContacto" novalidate>
            <label for="nombre">Nombre y apellido</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej: María González">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="tu@email.com">

            <label for="telefono">Teléfono / WhatsApp</label>
            <input type="tel" id="telefono" name="telefono" placeholder="11 2345 6789">

            <label for="tipo">Tipo de evento</label>
            <select id="tipo" name="tipo">
                <option value="">Elegí una opción</option>
                <option value="casamiento">Casamiento</option>
                <option value="15">Cumpleaños de 15</option>
                <option value="fiesta">Fiesta / otro</option>
            </select>

            <label for="mensaje">Contanos más</label>
            <textarea id="mensaje" name="mensaje" rows="4" placeholder="Fecha estimada, cantidad de invitados, qué servicios buscás..."></textarea>

            <button type="submit" class="btn btn-form">Enviar solicitud</button>

            <p class="form-msg" id="formMsg"></p>
        </form>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <p>🎉 FestejARG</p>
        <p>Casamientos · Cumpleaños de 15 · Fiestas</p>
        <p>&copy; 2026 FestejARG</p>
    </footer>

    <a href="https://wa.me/5490000000000" class="whatsapp-float" target="_blank" aria-label="Contactar por WhatsApp">💬</a>

    <script src="js/datos.js"></script>
    <script src="js/main.js"></script>
    <script src="js/contacto.js"></script>
</body>
</html>
